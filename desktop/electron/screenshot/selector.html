<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline';">
<title>框选题目</title>
<style>
* { box-sizing: border-box; cursor: default !important; user-select: none; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font: 13px -apple-system, 'Segoe UI', sans-serif; }
#area { position: fixed; inset: 0; background: rgba(20,24,36,.04); touch-action: none; }
#selection { display: none; position: absolute; border: 2px solid #6b80bf; background: rgba(107,128,191,.08); box-shadow: 0 0 0 20000px rgba(20,24,36,.08); pointer-events: none; }
#hint { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); padding: 10px 14px; border: 1px solid #d9deea; border-radius: 8px; background: #fff; color: #2b3040; box-shadow: 0 4px 18px #0002; white-space: nowrap; pointer-events: none; }
</style></head><body><div id="area"><div id="selection"></div></div>
<div id="hint" role="status">拖动框选题目，松开后识别 · Esc / 右键取消</div>
<script src="selector.js"></script></body></html>
