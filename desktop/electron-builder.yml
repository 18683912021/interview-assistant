# electron-builder.yml
appId: com.coagent.audio-capture
productName: AI面试助手
artifactName: Interview-Assistant-${version}-${os}-${arch}.${ext}
beforePack: scripts/before-pack.cjs
directories:
  output: release
files:
  - dist-electron/**/*
  - dist-renderer/**/*
  - package.json
  - assets/LICENSE-icons.txt
asar:
  smartUnpack: true
asarUnpack:
  # WASAPI native addon：asar 内的 .node 无法加载，必须解包
  - dist-electron/audio/native/**/*
win:
  artifactName: Interview-Assistant-${version}-windows-${arch}-setup.${ext}
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  # Preserve application icon/version resources even without a signing certificate.
  signExecutable: false
mac:
  target:
    - target: dmg
      arch:
        - arm64
  icon: assets/icon.icns
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  category: public.app-category.productivity
  # macOS 14.2+ system audio also requires a CoreAudio usage description.
  extendInfo:
    NSMicrophoneUsageDescription: 需要访问麦克风以采集您的声音用于实时转写
    NSAudioCaptureUsageDescription: 需要采集您选择的系统音频用于实时转写
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
publish:
  provider: generic
  url: https://update.coagent.example.com
