apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def releaseStoreFile = findProperty("AUDIO_CAPTURE_UPLOAD_STORE_FILE") ?: System.getenv("AUDIO_CAPTURE_UPLOAD_STORE_FILE")
def releaseStorePassword = findProperty("AUDIO_CAPTURE_UPLOAD_STORE_PASSWORD") ?: System.getenv("AUDIO_CAPTURE_UPLOAD_STORE_PASSWORD")
def releaseKeyAlias = findProperty("AUDIO_CAPTURE_UPLOAD_KEY_ALIAS") ?: System.getenv("AUDIO_CAPTURE_UPLOAD_KEY_ALIAS")
def releaseKeyPassword = findProperty("AUDIO_CAPTURE_UPLOAD_KEY_PASSWORD") ?: System.getenv("AUDIO_CAPTURE_UPLOAD_KEY_PASSWORD")
def releaseSigningConfigured = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { it != null && !it.toString().trim().isEmpty() }

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.poc.audiocapture"

    defaultConfig {
        applicationId "com.poc.audiocapture"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.core:core-ktx:1.15.0")
    implementation("com.squareup.okhttp3:okhttp:4.9.2")
    testImplementation("junit:junit:4.13.2")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
